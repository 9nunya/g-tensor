[workspace]
resolver = "2"
members = [
  "crates/g",
  "crates/g-core",
  "crates/g-cpu",
  "crates/g-ad",
  "crates/g-nn",
  "crates/g-apple",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.85"

[workspace.dependencies]
g-core = { path = "crates/g-core", version = "0.1.0" }
g-cpu = { path = "crates/g-cpu", version = "0.1.0" }
g-ad = { path = "crates/g-ad", version = "0.1.0" }
g-nn = { path = "crates/g-nn", version = "0.1.0" }
g-apple = { path = "crates/g-apple", version = "0.1.0" }
rayon = "1.10"
